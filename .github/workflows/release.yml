name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: darwin-arm64
            bun_target: ''
          - os: ubuntu-latest
            target: linux-x64
            bun_target: ''
          - os: ubuntu-latest
            target: linux-arm64
            bun_target: 'bun-linux-arm64'
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Test
        # Cross-compile target (linux-arm64 from an x64 ubuntu host) — skip
        # tests on the host because the cross-built binary can't execute here.
        # The host-native build above already ran the full suite.
        if: matrix.bun_target == ''
        run: bun test

      - name: Build folio binaries
        run: |
          mkdir -p dist
          TARGET_FLAG=""
          if [ -n "${{ matrix.bun_target }}" ]; then
            TARGET_FLAG="--target=${{ matrix.bun_target }}"
          fi
          bun build --compile --minify --sourcemap $TARGET_FLAG bin/folio.ts     --outfile dist/folio
          bun build --compile --minify --sourcemap $TARGET_FLAG bin/folio-mcp.ts --outfile dist/folio-mcp

      - name: Package release tarball
        run: |
          cp -r themes templates skills hooks og dist/
          cp README.md LICENSE dist/
          mkdir -p dist/docs
          cp docs/mcp-setup.md dist/docs/ 2>/dev/null || true
          cp -r assets dist/ 2>/dev/null || true
          # Install script — sets up themes/templates next to binary so execPath
          # fallback in config.ts picks them up.
          cat > dist/install.sh << 'EOF'
          #!/usr/bin/env bash
          set -e
          DEST="${FOLIO_PREFIX:-$HOME/.local/folio}"
          mkdir -p "$DEST"
          cp -r folio folio-mcp themes templates skills hooks og README.md LICENSE "$DEST/"
          [ -d docs ] && cp -r docs "$DEST/"
          chmod +x "$DEST/folio" "$DEST/folio-mcp"
          # macOS: the adhoc signature applied by `bun build --compile` survives
          # cross-machine transit but Gatekeeper rejects it as "invalid signature"
          # → SIGKILL when stdin is a pipe (e.g. MCP stdio mode). Re-sign locally
          # to fix. Linux: no codesign, nothing to do.
          if [ "$(uname -s)" = "Darwin" ] && command -v codesign >/dev/null 2>&1; then
            codesign --force --sign - "$DEST/folio"     >/dev/null 2>&1 || true
            codesign --force --sign - "$DEST/folio-mcp" >/dev/null 2>&1 || true
          fi
          echo "✓ Folio installed at $DEST"
          echo
          echo "Add to PATH (one of):"
          echo "  export PATH=\"$DEST:\$PATH\""
          echo "  ln -s $DEST/folio /usr/local/bin/folio"
          echo "  ln -s $DEST/folio-mcp /usr/local/bin/folio-mcp"
          echo
          echo "Then: folio init && folio serve"
          EOF
          chmod +x dist/install.sh
          tar czf folio-${{ matrix.target }}.tar.gz -C dist .
          ls -lh folio-${{ matrix.target }}.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: folio-${{ matrix.target }}
          path: folio-${{ matrix.target }}.tar.gz
          # Tylko przekazanie do joba `release`; paczki zostają w wydaniu na GitHubie.
          # Org NOTILABS ma 500 MB na artefakty łącznie (plan Free) — sc-11293.
          retention-days: 1

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false
